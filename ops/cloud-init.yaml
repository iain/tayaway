#cloud-config
#
# Once-only OS-level bootstrap for the new tayaway VM. Cloud-init runs
# this exactly once on first boot; iterable app-side setup lives in
# provision.sh (re-run via `mise run vm:provision <host>`). Anything that
# needs to change after first boot belongs in that script, not here.
#
# Rendered by Terraform via `templatefile`. The only template variable is
# `$${age_recipient}` (written verbatim below as `$${...}` to escape
# Terraform's own interpolation pass so apt's `$${distro_id}` and
# friends, which are *cloud-init* template vars, survive untouched).

# Lock the box down on first boot.
disable_root: true
ssh_pwauth: false

# A single non-root user that drives deploys + the container manager.
# Quadlet units land in /etc/containers/systemd/ (root-owned, system-wide)
# and run under their own UIDs inside their user namespaces — the
# `tayaway` user only needs ssh + sudo to push new images and reload.
users:
  - name: tayaway
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [systemd-journal]

# bootcmd runs before write_files, so creating /etc/tayaway here means
# the next section's write_files for /etc/tayaway/age.recipient lands in
# a directory with the perms/ownership we actually want — rather than
# the 0755 root:root cloud-init auto-creates if the parent is missing.
bootcmd:
  - install -d -m 0755 -o root -g root /etc/tayaway

# Cap journald growth. Without this, weeks of falcon + caddy access logs
# eat the whole boot disk on a busy day. Apt's unattended-upgrades file
# uses cloud-init's own template syntax — `$${distro_id}` survives
# Terraform's templatefile pass and is then expanded by cloud-init at
# render time.
write_files:
  - path: /etc/tayaway/age.recipient
    permissions: "0644"
    owner: root:root
    content: |
      ${age_recipient}

  - path: /etc/systemd/journald.conf.d/tayaway.conf
    permissions: "0644"
    owner: root:root
    content: |
      [Journal]
      SystemMaxUse=2G
      MaxRetentionSec=30d

  # Security updates without operator intervention; reboots stay manual so
  # a kernel CVE can't surprise-reboot a busy node mid-incident.
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    permissions: "0644"
    owner: root:root
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Allowed-Origins {
        "$${distro_id}:$${distro_codename}";
        "$${distro_id}:$${distro_codename}-security";
        "$${distro_id}ESMApps:$${distro_codename}-apps-security";
        "$${distro_id}ESM:$${distro_codename}-infra-security";
      };

  # Baseline nftables ruleset. Inbound is restricted to ssh + http(s);
  # forward stays accept so podman's own NAT/forward rules (installed by
  # the runtime, not visible here) keep working. Outbound is left wide
  # open intentionally — the stack legitimately reaches GHCR, OVH S3,
  # db-ip.com, ACME endpoints, and ntfy.sh, and a moving target of
  # CIDRs is more brittle than the value it adds. The HIPAA-grade
  # posture is already covered by container isolation + ReadOnly=true.
  - path: /etc/nftables.conf
    permissions: "0644"
    owner: root:root
    content: |
      #!/usr/sbin/nft -f
      flush ruleset

      table inet filter {
        chain input {
          type filter hook input priority 0; policy drop;
          ct state established,related accept
          iifname "lo" accept
          ip protocol icmp accept
          ip6 nexthdr icmpv6 accept
          tcp dport 22 accept
          tcp dport { 80, 443 } accept
        }

        chain forward {
          type filter hook forward priority 0; policy accept;
        }

        chain output {
          type filter hook output priority 0; policy accept;
        }
      }

# apt: pin nothing — unattended-upgrades is going to track the latest in
# the distribution anyway.
package_update: true
package_upgrade: true
packages:
  - podman
  - skopeo
  - nftables
  - unattended-upgrades
  - rsync                # provision.sh uses it to copy quadlet units up
  - curl
  - ca-certificates
  - gnupg

# runcmd fires once across cloud-init's lifetime (per-instance), which is
# what we want for this bootstrap. provision.sh waits for cloud-init's own
# `status --wait` to settle across the reboot below, so no sentinel file
# is needed here.
runcmd:
  # The tayaway user's authorized_keys is empty out of the gate; mirror
  # OVH's injected key from root so `ssh tayaway@host` works immediately.
  - install -d -m 0700 -o tayaway -g tayaway /home/tayaway/.ssh
  - install -m 0600 -o tayaway -g tayaway /root/.ssh/authorized_keys /home/tayaway/.ssh/authorized_keys
  - install -d -m 0755 /etc/containers/systemd
  # Pick up the journald config we just wrote.
  - systemctl restart systemd-journald
  # Apply the nftables baseline and survive reboots.
  - systemctl enable --now nftables

# Reboot at the end of cloud-init to pick up the kernel from
# package_upgrade (often a fresh image is one or two security releases
# behind). cloud-init only fires this on first boot, so it never loops.
power_state:
  mode: reboot
  timeout: 120
  condition: True
  message: First-boot bootstrap complete — rebooting to pick up the upgraded kernel.
