# Loads operator credentials from secrets.yaml (sops + age) for any
# `tofu` invocation run from ops/ or ops/bootstrap/. Recipients live
# in ../.sops.yaml; rotating one is "edit .sops.yaml, sops updatekeys
# secrets.yaml, commit". `redact = true` keeps mise from echoing the
# decrypted values into any task output.
#
# The age private key is looked up from $SOPS_AGE_KEY_FILE (or the
# mise-specific $MISE_SOPS_AGE_KEY_FILE) — operators typically have
# the standard sops path ~/.config/sops/age/keys.txt exported; CI sets
# $SOPS_AGE_KEY directly from the GitHub Secret. See ops/README.md.
#
# Non-secret values stay in plaintext below — committing them in git
# is fine, the OVH project id and the new VPS IPv4 are public-facing.

[env]
_.file = { path = "secrets.yaml", redact = true }

OVH_ENDPOINT = "ovh-eu"
OVH_PROJECT_ID = "387ebd71f4c34177a3b2b8e8025d171b"
TF_VAR_service_name = "387ebd71f4c34177a3b2b8e8025d171b"
TF_VAR_vps_ipv4 = "51.178.47.84"
TF_VAR_vps_ipv6 = "2001:41d0:404:200::2460"
