<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Amber fill for letters -->
    <linearGradient id="amberFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass specular: bright highlight on top portion of letters -->
    <linearGradient id="glassHighlight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glass edge stroke -->
    <linearGradient id="glassEdge" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop shadow behind letters -->
    <filter id="dropShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feOffset in="shadow" dx="0" dy="6" result="offsetShadow"/>
      <feMerge>
        <feMergeNode in="offsetShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text shape for reuse -->
    <text id="thw" x="512" y="545" text-anchor="middle" dominant-baseline="central"
      font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
      font-weight="800" font-size="340" letter-spacing="-8">THW</text>

    <!-- Clip to letter shapes -->
    <clipPath id="textClip">
      <use href="#thw"/>
    </clipPath>
  </defs>

  <!-- Letter group with drop shadow -->
  <g filter="url(#dropShadow)">
    <!-- Base amber fill -->
    <use href="#thw" fill="url(#amberFill)"/>

    <!-- Glass edge border -->
    <use href="#thw" fill="none" stroke="url(#glassEdge)" stroke-width="2.5"/>

    <!-- Specular highlight overlay clipped to letters -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#glassHighlight)" clip-path="url(#textClip)"/>
  </g>
</svg>
