# Local-stack equivalent of the production podman/quadlet setup. Mirrors the
# unit shape (db, migrate, geoip, web, edge) so phase 1 verification exercises
# the same ordering, volume layout, and read-only/tmpfs constraints. Drives
# the same `containers/Containerfile` and the same toolchain image SHA that
# CI publishes — no fork between local and prod.
#
# Usage:
#   TOOLCHAIN_TAG=$(./.mise/tasks/toolchain/tag) podman compose up --build
#
# The TOOLCHAIN_TAG default falls back to `latest`, which won't resolve until
# CI's first push. Always pass the explicit tag locally so you build against
# the same toolchain image CI uses.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: tayaway
      POSTGRES_PASSWORD: tayaway
      POSTGRES_DB: tayaway
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayaway"]
      interval: 5s
      timeout: 3s
      retries: 10

  geoip:
    build:
      context: .
      dockerfile: containers/Containerfile.geoip
    volumes:
      - geoip-data:/data
    # Oneshot; podman compose treats `restart: no` as run-once. The web
    # service waits for `service_completed_successfully` below.
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: containers/Containerfile
      target: backend
      args:
        TOOLCHAIN_IMAGE: ghcr.io/iain/tayaway-toolchain:${TOOLCHAIN_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tayaway:tayaway@db:5432/tayaway
      APP_SECRET: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
      FRONTEND_URL: http://localhost:8080
      MISE_ENV: production
    command: ["bundle", "exec", "rake", "config:validate", "db:migrate"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: containers/Containerfile
      target: backend
      args:
        TOOLCHAIN_IMAGE: ghcr.io/iain/tayaway-toolchain:${TOOLCHAIN_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      geoip:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://tayaway:tayaway@db:5432/tayaway
      APP_SECRET: dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
      FRONTEND_URL: http://localhost:8080
      MISE_ENV: production
      FALCON_URL: http://0.0.0.0:9292
    # Phase 1 verification target: the rootfs is read-only and /tmp is the
    # only writable surface. Falcon's socket dir, ERB compile cache, and any
    # other in-process scratch land in /tmp; nothing writes outside it.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - geoip-data:/app/backend/data:ro
    ports:
      - "9292:9292"

  edge:
    build:
      context: .
      dockerfile: containers/Containerfile
      target: edge
      args:
        TOOLCHAIN_IMAGE: ghcr.io/iain/tayaway-toolchain:${TOOLCHAIN_TAG:-latest}
    depends_on:
      web:
        condition: service_started
    environment:
      SITE_ADDRESS: ":8080"
      BACKEND_UPSTREAM: web:9292
    ports:
      - "8080:8080"

volumes:
  db-data:
  geoip-data:
