[settings]
experimental = true

[tools]
node = "24"
ruby = "4"
"npm:pnpm" = "11.0.0"

[env]
# Required for any forked-worker setup on macOS (falcon-host, falcon serve,
# rspec parallelisation): without it, libpq triggers Foundation's fork-safety
# guard and the child process aborts on its first DB connect. Linux ignores
# the variable, so it's safe to set unconditionally for everything mise runs.
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"

# ── Workflows ────────────────────────────────────────────────────────────────
#
#   dev     Start frontend + backend servers
#   check   Pre-commit: lint, typecheck, test, audit (no e2e)
#   ci      Full verification: check + e2e
#

[tasks.dev]
description = "Start frontend + backend dev servers"
depends = ["dev:backend", "dev:frontend"]
wait_for = ["dev:backend"]
run = "echo 'Dev servers started'"

[tasks."dev:backend"]
description = "Start backend dev server"
depends = ["db:seed"]
dir = "{{config_root}}/backend"
run = "bundle exec falcon-host falcon.rb"

[tasks."dev:frontend"]
description = "Start frontend dev server"
dir = "{{config_root}}/frontend"
run = "pnpm run dev"

[tasks."dev:reset"]
description = "Kill any falcon-host / fsevent_watch processes left holding the dev backend port"
run = """
pids=$(lsof -ti :9292 2>/dev/null || true)
if [ -n "$pids" ]; then
  echo "Killing $(echo $pids | wc -w | tr -d ' ') process(es) on :9292"
  kill -KILL $pids 2>/dev/null || true
fi
pkill -KILL -f fsevent_watch 2>/dev/null && echo "Killed orphaned fsevent_watch" || true
echo "Dev backend port is free."
"""

[tasks.check]
description = "Pre-commit: lint, typecheck, test, audit, cache-version (no e2e)"
depends = [
  "lint:*",
  "typecheck:*",
  "test:*",
  "audit:*",
  "check:cache-version",
]

[tasks."check:cache-version"]
description = "Verify CACHE_VERSION is bumped when pool-cache schema changes"
run = "./scripts/check-cache-version.sh"

[tasks.ci]
description = "Full CI: check + e2e"
depends = ["check", "e2e"]

# ── Lint (always autofix) ────────────────────────────────────────────────────

[tasks.lint]
description = "Lint and autofix all code"
depends = ["lint:*"]

[tasks."lint:frontend"]
description = "ESLint with autofix"
dir = "{{config_root}}/frontend"
run = "pnpm exec eslint src --fix"

[tasks."lint:backend"]
description = "RuboCop with autofix"
dir = "{{config_root}}/backend"
run = "bundle exec rubocop -A -f q"

# ── Typecheck ────────────────────────────────────────────────────────────────

[tasks.typecheck]
description = "Run all type checkers"
depends = ["typecheck:*"]

[tasks."typecheck:frontend"]
description = "Vue + TypeScript type checking"
dir = "{{config_root}}/frontend"
run = "pnpm exec vue-tsc -b"

# ── Test ─────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run unit and integration tests"
depends = ["test:*"]

[tasks."test:frontend"]
description = "Vitest"
dir = "{{config_root}}/frontend"
run = "pnpm exec vitest run --reporter=dot --silent"

[tasks."test:backend"]
description = "RSpec"
dir = "{{config_root}}/backend"
run = "RACK_ENV=test bundle exec rspec -f progress"

# ── E2E (standalone — not part of test:*) ────────────────────────────────────

[tasks.e2e]
description = "Playwright end-to-end tests"
depends = ["db:setup-e2e"]
run = "pnpm exec playwright test"

# ── Audit ────────────────────────────────────────────────────────────────────

[tasks.audit]
description = "Dependency vulnerability scanning"
depends = ["audit:*"]

[tasks."audit:frontend"]
description = "pnpm audit"
dir = "{{config_root}}/frontend"
run = "pnpm audit --audit-level=high"

[tasks."audit:backend"]
description = "bundler-audit"
dir = "{{config_root}}/backend"
run = "bundle exec bundler-audit check --update"

# ── Build & Deploy ───────────────────────────────────────────────────────────

[tasks.build]
description = "Build production frontend assets"
dir = "{{config_root}}/frontend"
run = "pnpm run build"

[tasks.deploy]
description = "Deploy to production"
run = "bundle exec cap production deploy"

# ── Database ─────────────────────────────────────────────────────────────────

[tasks."db:create"]
description = "Create the development database"
dir = "{{config_root}}/backend"
run = "bundle exec rake db:create"

[tasks."db:drop"]
description = "Drop the development database"
dir = "{{config_root}}/backend"
run = "bundle exec rake db:drop"

[tasks."db:migrate"]
description = "Run database migrations"
dir = "{{config_root}}/backend"
run = "bundle exec rake db:migrate"

[tasks."db:rollback"]
description = "Rollback the last migration"
dir = "{{config_root}}/backend"
run = "bundle exec rake db:rollback"

[tasks."db:reset"]
description = "Reset the development database"
dir = "{{config_root}}/backend"
run = "bundle exec rake db:reset"

[tasks."db:seed"]
description = "Seed the development database"
dir = "{{config_root}}/backend"
run = "bundle exec rake db:seed"

[tasks."db:seed-dev"]
description = "Populate the development database with rich sample data"
dir = "{{config_root}}/backend"
run = "RACK_ENV=development bundle exec ruby db/seed_dev.rb"

[tasks."db:setup-e2e"]
description = "Create and migrate the e2e database"
dir = "{{config_root}}/backend"
run = "RACK_ENV=e2e bundle exec rake db:create db:migrate"

# ── Setup ────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "Set up the project after cloning"
depends = ["setup:deps", "setup:db"]
run = "echo \"Setup complete! Run 'mise run dev' to start.\""

[tasks."setup:deps"]
description = "Install all dependencies"
depends = ["setup:deps-frontend", "setup:deps-backend", "setup:deps-root"]

[tasks."setup:deps-frontend"]
description = "Install frontend dependencies"
dir = "{{config_root}}/frontend"
run = "pnpm install"

[tasks."setup:deps-backend"]
description = "Install backend dependencies"
dir = "{{config_root}}/backend"
run = "bundle install"

[tasks."setup:deps-root"]
description = "Install root dependencies (Playwright)"
run = "pnpm install"

[tasks."setup:db"]
description = "Create and migrate all databases"
dir = "{{config_root}}/backend"
run = """
echo "Setting up development database..."
RACK_ENV=development bundle exec rake db:create db:migrate

echo "Setting up test database..."
RACK_ENV=test bundle exec rake db:create db:migrate

echo "Setting up e2e database..."
RACK_ENV=e2e bundle exec rake db:create db:migrate

echo "All databases ready"
"""

# ── Data ─────────────────────────────────────────────────────────────────────

[tasks."data:geoip"]
description = "Download DB-IP Lite city database for IP geolocation"
dir = "{{config_root}}/backend"
run = """
mkdir -p data
MONTH=$(date +%Y-%m)
URL="https://download.db-ip.com/free/dbip-city-lite-${MONTH}.mmdb.gz"
echo "Downloading DB-IP Lite city database (${MONTH})..."
curl -fSL -o /tmp/dbip-city-lite.mmdb.gz "$URL"
gunzip -c /tmp/dbip-city-lite.mmdb.gz > data/dbip-city-lite.mmdb
rm /tmp/dbip-city-lite.mmdb.gz
echo "Saved to backend/data/dbip-city-lite.mmdb"
"""

# ── Backup ───────────────────────────────────────────────────────────────────

[tasks."db:backup"]
description = "Trigger a database backup on the production server"
run = "ssh -p 50022 ubuntu@tayaway.nl '/var/www/tayaway/current/config/deploy/backup-db.sh'"

# ── Misc ─────────────────────────────────────────────────────────────────────

[tasks.console]
description = "Open a Ruby console with the app loaded"
dir = "{{config_root}}/backend"
run = "bundle exec pry -r ./config/environment"
