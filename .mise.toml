# Fail fast on older mise binaries — monorepo mode and several of the
# settings below didn't exist before this release.
min_version = "2026.5.5"

# Marks this file as the root of a mise monorepo. Subproject mise.toml files
# (listed below under [monorepo]) get their own tools, env, and tasks, and
# inherit from this root. Cross-subproject task references use //path:task
# (and //...:task wildcards). Gated on the `experimental = true` setting
# below — no env var needed.
experimental_monorepo_root = true

[monorepo]
config_roots = ["backend", "frontend"]

[hooks]
# After installing or updating any tool, refresh the project's deps so a
# `mise install` (or a Ruby/Node bump that triggers one) leaves you with a
# working bundle + node_modules. setup:deps fans out to both subprojects.
postinstall = { task = "setup:deps" }

[settings]
experimental = true

# Pin resolved tool versions + checksums into mise.lock so installs are
# reproducible across the team and CI. Equivalent to Gemfile.lock /
# pnpm-lock.yaml but for the toolchain itself.
lockfile = true

# Supply-chain verification at install time. Both are no-ops for backends
# that don't publish provenance, so leaving them on is free insurance for
# the tools that do.
github_attestations = true
slsa = true

# Tools that every subproject (and root scripts: prettier, Playwright)
# needs. Ruby is here rather than in backend/mise.toml because Capistrano
# runs from the repo root during deploy and needs to resolve Ruby via
# mise exec — monorepo inheritance flows root → subproject, not the
# other way. The frontend-only-dev cost of installing Ruby is small
# compared to duplicating tool resolution into the deploy pipeline.
[tools]
node = "26"
ruby = "4"
"npm:pnpm" = "11.1.2"

# ── Workflows ────────────────────────────────────────────────────────────────
#
#   dev     Start frontend + backend servers
#   check   Pre-commit: lint, typecheck, test, audit (no e2e)
#   ci      Full verification: check + e2e
#

[tasks.dev]
description = "Start frontend + backend dev servers"
alias = "d"
depends = ["//backend:dev", "//frontend:dev"]
wait_for = ["//backend:dev"]
run = "echo 'Dev servers started'"

[tasks.check]
description = "Full local validation: lint, typecheck, test, audit, cache-version (no e2e)"
alias = "c"
depends = [
  "//...:lint",
  "//...:typecheck",
  "//...:test",
  "//...:audit",
  "check:cache-version",
]

[tasks.precommit]
description = "Pre-commit hook: fast formatters only (lint + cache-version). Full validation lives in `check` and CI."
depends = ["lint", "check:cache-version"]

[tasks."check:cache-version"]
description = "Verify CACHE_VERSION is bumped when pool-cache schema changes"
run = "./scripts/check-cache-version.sh"
sources = ["frontend/src/api/poolDb.ts", "scripts/check-cache-version.sh"]
outputs = { auto = true }

[tasks.ci]
description = "Full CI: check + e2e"
depends = ["check", "e2e"]

# ── Aggregate task wildcards ─────────────────────────────────────────────────
#
# These collapse `lint:backend + lint:frontend` etc. into a single root task.
# Subproject definitions are the source of truth; root just fans out.

[tasks.lint]
description = "Lint all code (autofix locally; report-only when $CI is set)"
depends = ["//...:lint", "lint:config", "docs:tasks"]

[tasks."lint:config"]
description = "Canonically format all mise.toml files"
run = "mise fmt"
sources = [".mise.toml", "backend/mise.toml", "frontend/mise.toml"]
outputs = { auto = true }

[tasks."docs:tasks"]
description = "Regenerate TASKS.md from mise task descriptions and usage specs"
# Pinned in lint so the checked-in reference can't drift from the source
# of truth. In pre-commit context (MISE_PRE_COMMIT=1, set by the generated
# hook), also stage the regenerated file so it lands in the in-flight
# commit — without this, a task-definition change would leave TASKS.md
# modified in the working tree and require a second commit. Outside
# pre-commit, the regen runs but staging is left alone.
run = """
mise generate task-docs --output TASKS.md
if [ -n "${MISE_PRE_COMMIT:-}" ]; then
  git add TASKS.md
fi
"""
sources = [
  ".mise.toml",
  "backend/mise.toml",
  "frontend/mise.toml",
  ".mise/tasks/**",
  "backend/.mise/tasks/**",
  "frontend/.mise/tasks/**",
]
outputs = ["TASKS.md"]

[tasks.typecheck]
description = "Run all type checkers"
depends = ["//...:typecheck"]

[tasks.test]
description = "Run unit and integration tests"
alias = "t"
depends = ["//...:test"]

[tasks.audit]
description = "Dependency vulnerability scanning"
depends = ["//...:audit"]

[tasks.build]
description = "Build production frontend assets"
depends = ["//frontend:build"]

# ── E2E (standalone — not part of test:*) ────────────────────────────────────

[tasks.e2e]
description = "Playwright end-to-end tests — extra args pass through to playwright"
depends = ["//backend:db:setup-e2e"]
# Playwright still calls `module.register()` to install its TS ESM loader;
# on Node 22+ that emits DEP0205. Silence only that code so real deprecation
# warnings stay visible. Drop once Playwright migrates to registerHooks().
env = { NODE_OPTIONS = "--disable-warning=DEP0205" }
run = 'pnpm exec playwright test "$@"'

# Visual-regression baselines (the `*-snapshots/` directories next to specs)
# are environment-dependent — font rendering and antialiasing differ between
# macOS and the Ubuntu runners that drive ci.yml. To keep a single committed
# baseline that matches CI, this task fires the `update-snapshots` workflow on
# the current branch instead of running playwright locally; the workflow
# regenerates on Linux and pushes the refreshed images back here. A `git pull`
# after completion brings them down. Requires gh CLI auth + a pushed branch.
[tasks."e2e:snapshots:update"]
description = "Trigger the GitHub workflow that regenerates Playwright visual baselines on Linux and commits them back"
shell = "bash -c"
run = """
set -euo pipefail
branch=$(git rev-parse --abbrev-ref HEAD)
if [ "$branch" = "HEAD" ]; then
  echo "Detached HEAD — check out a branch before refreshing baselines." >&2
  exit 1
fi
echo "→ dispatching update-snapshots.yml on branch '$branch'"
gh workflow run update-snapshots.yml --ref "$branch"
echo "→ waiting for the run to appear (gh polls every ~3s)…"
sleep 5
run_id=$(gh run list --workflow=update-snapshots.yml --branch "$branch" --limit 1 --json databaseId --jq '.[0].databaseId')
echo "→ watching run $run_id"
gh run watch "$run_id" --exit-status
echo "→ pulling the new baseline commit"
git pull --ff-only origin "$branch"
"""

# ── Backend convenience aliases ──────────────────────────────────────────────
#
# Root-level passthroughs so `mise run db:migrate` from the project root keeps
# working the way it always has. The real definitions live in backend/mise.toml.

[tasks."db:create"]
description = "Create the development database"
depends = ["//backend:db:create"]

[tasks."db:drop"]
description = "Drop the development database"
depends = ["//backend:db:drop"]

[tasks."db:migrate"]
description = "Run database migrations"
depends = ["//backend:db:migrate"]

[tasks."db:rollback"]
description = "Rollback the last migration"
depends = ["//backend:db:rollback"]

[tasks."db:reset"]
description = "Reset the development database"
depends = ["//backend:db:reset"]

[tasks."db:seed"]
description = "Seed the development database"
depends = ["//backend:db:seed"]

[tasks."db:seed-dev"]
description = "Populate the development database with rich sample data"
depends = ["//backend:db:seed-dev"]

[tasks."db:backup"]
description = "Trigger a database backup on the production server"
depends = ["//backend:db:backup"]

[tasks.console]
description = "Open a Ruby console with the app loaded"
depends = ["//backend:console"]

[tasks."dev:reset"]
description = "Kill any falcon-host / fsevent_watch processes left holding the dev backend port"
depends = ["//backend:dev:reset"]

# ── Deploy ───────────────────────────────────────────────────────────────────

[tasks.deploy]
description = "Deploy to production"
confirm = "Deploy to PRODUCTION. Continue?"
run = "bundle exec cap production deploy"

# ── Setup ────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "Set up the project after cloning"
depends = ["setup:deps", "setup:db", "setup:hooks", "//backend:data:geoip"]
run = "echo \"Setup complete! Run 'mise run dev' to start.\""

[tasks."setup:deps"]
description = "Install all dependencies"
depends = ["//...:setup:deps", "setup:deps-root"]

[tasks."setup:deps-root"]
description = "Install root dependencies (Playwright, prettier)"
# `playwright install` is idempotent — it skips browsers already present in
# ~/Library/Caches/ms-playwright, so re-running setup is cheap. Skip
# --with-deps; on Linux it shells out to apt and wants sudo, which is fine
# in CI / the devcontainer but a friction point for a local dev setup. If
# you hit a missing system lib, run it manually with --with-deps.
run = ["pnpm install", "pnpm exec playwright install chromium"]

[tasks."setup:db"]
description = "Create and migrate the development, test, and e2e databases"
depends = ["//backend:setup:db"]

[tasks."tools:upgrade"]
description = "Bump every config_root's tool versions to the latest available"
# `mise upgrade --bump` only walks the current config_root, so running it at
# the project root never touches backend/mise.lock. Loop so a single command
# bumps every subproject's pins. setup:deps fires via the postinstall hook
# after the install, reinstalling gems/node_modules against the new Rubies/
# Nodes.
shell = "bash -c"
run = """
for dir in . backend frontend; do
  echo "→ upgrading $dir"
  (cd "$dir" && mise upgrade --bump)
done
"""

[tasks."setup:hooks"]
description = "Install the git pre-commit hook"
# Writes .git/hooks/pre-commit that runs `mise run precommit` on commit
# (fast formatters only — full validation runs in CI and via `mise run check`).
# Each clone needs this once; rerunning is harmless. The unset clears the
# leftover `core.hooksPath = .husky/_` from clones that pre-date the husky
# removal.
run = """
git config --unset core.hooksPath 2>/dev/null || true
mise generate git-pre-commit --task precommit --write
"""
