# Drift detection for ops/*.tf. Fails the run if `tofu plan` against the
# committed config doesn't match what OVH actually has. Catches "someone
# clicked something in the OVH console" before it becomes invisible state.
#
# Triggers:
#   - PRs touching ops/** so config changes get planned at review time.
#   - Weekly schedule (Mondays 06:00 UTC) so out-of-band changes surface
#     within a week even on quiet PR weeks.
#
# Credentials:
#   - SOPS_AGE_KEY — CI's age private key. Decrypts ops/secrets.yaml,
#                    which holds the OVH API triple (full read-write —
#                    OVH's API rejects GET on the s3Credentials endpoint
#                    for any read-only-scope token, regardless of how
#                    broad `GET /*` is) and the state-bucket S3 keypair.
#                    Drift detection runs strictly `tofu plan
#                    -detailed-exitcode`, no `apply` codepath exists,
#                    so the practical write-capability isn't exercised
#                    even though it's in the token.
#
# The CI recipient is only added to ops/secrets.yaml.
# backend/.env.production.yaml is encrypted to operator + production
# only — CI cannot decrypt it. That's the structural reason production
# runtime secrets never reach a GitHub runner.
#
# No PR-author-controlled text ever reaches a shell or script step
# (the PR comment body is read from a file written by `tofu plan`,
# not from `github.event.*`).
#
# Missing the secret is handled gracefully: a single "secrets check"
# step at the top sets a `skip` output if it isn't configured, and the
# rest of the job is gated on it. That way a fresh PR (or a fork PR
# with no secret access) gets an annotation rather than a red X — the
# workflow still runs but reports "not configured" instead of
# pretending drift detection is happening when it isn't.

name: ops drift

on:
  pull_request:
    paths:
      - "ops/**"
      - ".sops.yaml"
      - ".github/workflows/ops-drift.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ops-drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops
    env:
      CI_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

    steps:
      - uses: actions/checkout@v6

      # Without this, missing SOPS_AGE_KEY surfaces deep inside mise as
      # "failed to decrypt", which is opaque and red-Xs any PR opened
      # before someone's done the GitHub repo setup.
      - id: secrets
        name: Check required GitHub secret
        run: |
          if [ -z "$CI_AGE_KEY" ]; then
            echo "::warning::Drift detection skipped — SOPS_AGE_KEY secret is not configured."
            echo "::warning::See ops/README.md 'Drift detection' for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Materialize the age key to a file rather than relying on the
      # SOPS_AGE_KEY env var directly. age-keygen's output includes
      # comment lines (# created: …, # public key: …) above the secret
      # key, which is valid in a file but not as a one-line env value
      # (rops fails with "invalid Bech32 encoding" on the first comment
      # line). File-based loading accepts both shapes, so an operator
      # piping the unedited age-keygen output via `gh secret set` works
      # without remembering to strip headers.
      - name: Materialize CI age key
        if: steps.secrets.outputs.skip != 'true'
        run: |
          install -d -m 0700 "$HOME/.config/sops/age"
          umask 077
          printf '%s\n' "$CI_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          echo "SOPS_AGE_KEY_FILE=$HOME/.config/sops/age/keys.txt" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          install: true
          cache: true

      - uses: opentofu/setup-opentofu@v1
        if: steps.secrets.outputs.skip != 'true'
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false

      # `mise exec --` loads ops/mise.toml's [env] block (including the
      # sops-decrypted secrets.yaml) into tofu's process env only. The
      # decrypted values never enter $GITHUB_ENV — keeps them out of any
      # subsequent step's logs.
      - name: tofu init
        if: steps.secrets.outputs.skip != 'true'
        run: mise exec -- tofu init -input=false -lockfile=readonly

      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = drift. Capture
      # the code first so the PR-comment step can still run, then re-fail.
      - name: tofu plan
        id: plan
        if: steps.secrets.outputs.skip != 'true'
        run: |
          set +e
          mise exec -- tofu plan -input=false -detailed-exitcode -no-color -out=tfplan | tee plan.txt
          code=${PIPESTATUS[0]}
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Truncate to ~50k chars so we stay well under GitHub's 65536-char
      # comment ceiling. Sticky-PR-comment then upserts a single comment
      # keyed by the `header` field, so iterating on a PR doesn't pile up
      # stale plan dumps. Input is plan.txt (written by `tofu plan`); no
      # PR-author-controlled text ever reaches a shell here.
      - name: Prepare plan body
        if: steps.secrets.outputs.skip != 'true' && github.event_name == 'pull_request'
        run: |
          {
            echo '### `tofu plan` (ops/)'
            echo
            echo '```'
            head -c 50000 plan.txt
            if [ "$(wc -c < plan.txt)" -gt 50000 ]; then
              echo
              echo '…(truncated)'
            fi
            echo '```'
          } > plan-comment.md

      - name: Upsert plan comment
        if: steps.secrets.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ops-drift-plan
          path: ops/plan-comment.md

      - name: Fail on drift
        if: steps.secrets.outputs.skip != 'true'
        env:
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          if [ "$EXIT_CODE" = "2" ]; then
            echo "::error::tofu plan reports drift — either commit the change or revert it in OVH."
            exit 1
          elif [ "$EXIT_CODE" != "0" ]; then
            echo "::error::tofu plan failed."
            exit 1
          fi
