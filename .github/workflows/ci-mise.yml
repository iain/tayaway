# Reference workflow generated by `mise generate github-action --task ci`.
#
# This is the minimal shape mise recommends for a mise-driven pipeline. The
# real CI lives in ci.yml and adds the bits mise can't infer on its own:
# Postgres service, libmaxminddb-dev, Playwright browser cache, DB setup,
# DATABASE_URL wiring. Manual-trigger only so it doesn't run alongside the
# real workflow.

name: ci-mise

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_EXPERIMENTAL: true

jobs:
  ci-mise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v3
      - run: mise run ci
