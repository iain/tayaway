# Builds the backend and edge images from the unified containers/Containerfile,
# plus the standalone geoip-loader from containers/Containerfile.geoip, and
# pushes them to GHCR tagged by git SHA on a main push.
#
# It publishes ONLY the per-commit :<sha> — never :main. The box's pull-based
# self-deploy follows :main, and promote-main.yml moves :main to the :<sha>
# after CI passes on main, so a built-but-test-failing commit can't deploy.
#
# The two targets pull disjoint internal stages out of the same Containerfile
# (backend via gem-build, edge via frontend-build), so building them as two
# steps does not duplicate work. Registry layer cache via :buildcache keeps
# the common-path build at ~30s.
#
# PRs build without pushing — catches Containerfile breakage at review time
# without giving forked-PR runs write access to GHCR. On PRs the images are
# loaded locally for the Trivy scan and the containerised-e2e job below.

name: App images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "containers/**"
      - "backend/**"
      - "frontend/**"
      - "aube-lock.yaml"
      - "aube-workspace.yaml"
      - "package.json"
      - ".mise/tasks/toolchain/**"
      - "**/mise.lock"
      - ".github/workflows/images.yml"
      # Containerised-e2e (below) reuses the images this workflow builds, so a
      # change to the e2e harness needs to start it here too.
      - "e2e/**"
      - "playwright.config.ts"
  workflow_dispatch:

# Push runs must not cancel each other: every main SHA needs to produce its
# pair of images, so a deploy that pins that SHA finds them. PR runs are safe
# to cancel — only the HEAD commit matters.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write
  # dorny/paths-filter reads the PR's changed-file list to decide whether to
  # run the containerised e2e below.
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # The tag script is plain bash + git, so it does not need a mise
      # install to run. Matches the computation in toolchain.yml exactly.
      - name: Compute toolchain tag
        id: toolchain
        run: echo "tag=$(./.mise/tasks/toolchain/tag)" >> "$GITHUB_OUTPUT"

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      # When mise.lock changes, toolchain.yml is racing this workflow to
      # publish the new toolchain tag. Wait up to fifteen minutes (matching
      # toolchain.yml's own timeout) before giving up. In the common case
      # (lockfile unchanged) the first probe returns immediately. The
      # toolchain image is a public package, so anonymous inspect is enough.
      - name: Wait for toolchain image
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.toolchain.outputs.tag }}
        run: |
          for i in $(seq 1 90); do
            if skopeo inspect "docker://ghcr.io/${OWNER}/tayaway-toolchain:${TAG}" >/dev/null 2>&1; then
              echo "toolchain ${TAG} present"
              exit 0
            fi
            echo "waiting for toolchain ${TAG} (${i}/90)"
            sleep 10
          done
          echo "toolchain ${TAG} never appeared — check the toolchain workflow"
          exit 1

      # Login on all events: the read-only GITHUB_TOKEN is enough for PR
      # builds to pull the private :buildcache layers, which is the whole
      # point of the cache. Push is gated separately on ref == main.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          target: backend
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # PR-only: load into the local daemon so the Trivy step can scan it
          # (nothing is pushed on PRs). push and load are mutually exclusive but
          # never overlap — push is main-only, load is PR-only.
          load: ${{ github.event_name == 'pull_request' }}
          # Publish only the per-commit :<sha>. The moving :main tag the box's
          # pull-based self-deploy follows is advanced separately by
          # promote-main.yml, and only after CI passes on main — so a successful
          # build here cannot by itself deploy a red commit.
          tags: ghcr.io/${{ github.repository_owner }}/tayaway-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            TOOLCHAIN_IMAGE=ghcr.io/${{ github.repository_owner }}/tayaway-toolchain:${{ steps.toolchain.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-backend:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/tayaway-backend:buildcache,mode=max', github.repository_owner) || '' }}

      - name: Build and push edge
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          target: edge
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # PR-only: load into the local daemon so the Trivy step can scan it
          # (nothing is pushed on PRs). push and load are mutually exclusive but
          # never overlap — push is main-only, load is PR-only.
          load: ${{ github.event_name == 'pull_request' }}
          # Only :<sha> here; :main is moved by promote-main.yml after CI.
          tags: ghcr.io/${{ github.repository_owner }}/tayaway-edge:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            TOOLCHAIN_IMAGE=ghcr.io/${{ github.repository_owner }}/tayaway-toolchain:${{ steps.toolchain.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-edge:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/tayaway-edge:buildcache,mode=max', github.repository_owner) || '' }}

      # Standalone single-stage image (FROM alpine, no toolchain dependency),
      # so no build-args and no toolchain wait. Shares the per-commit SHA with
      # the app images, though the geoip volume refreshes on its own monthly
      # timer rather than per deploy.
      - name: Build and push geoip loader
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile.geoip
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # PR-only: load into the local daemon so the Trivy step can scan it
          # (nothing is pushed on PRs). push and load are mutually exclusive but
          # never overlap — push is main-only, load is PR-only.
          load: ${{ github.event_name == 'pull_request' }}
          # Only :<sha> here; :main is moved by promote-main.yml after CI.
          tags: ghcr.io/${{ github.repository_owner }}/tayaway-geoip:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-geoip:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/tayaway-geoip:buildcache,mode=max', github.repository_owner) || '' }}

      # Custom Postgres image: postgres:18 + wal-g compiled from source with
      # libsodium (the prebuilt wal-g binaries omit it). No toolchain dep; the
      # cgo build of libsodium/brotli is the slow part, so the registry cache
      # matters here. Shares the per-commit SHA with the app images.
      - name: Build and push db
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile.db
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          # PR-only: load into the local daemon so the Trivy step can scan it
          # (nothing is pushed on PRs). push and load are mutually exclusive but
          # never overlap — push is main-only, load is PR-only.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/tayaway-db:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-db:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && format('type=registry,ref=ghcr.io/{0}/tayaway-db:buildcache,mode=max', github.repository_owner) || '' }}

      # Scan the freshly built images for known, fixable CVEs. PR-only: the
      # steps above load the images into the local daemon on PRs, so a finding
      # surfaces at review time, before the SHA is pushed or self-deployed.
      # --ignore-unfixed keeps it actionable (fails only on vulns with a fix).
      #
      # Two tiers. The images we author (backend, geoip) hard-gate on
      # HIGH/CRITICAL — that's our code and base layers, which we can patch.
      # The upstream-binary-heavy images (edge=Caddy, db=postgres+wal-g) are
      # report-only: their findings live inside third-party Go binaries (gosu's
      # stdlib, Caddy/wal-g module deps) whose fix is an upstream release, which
      # Dependabot base-image / WALG_VERSION bumps pick up. Gating them would
      # mean ignoring stdlib CVEs by ID — too broad, it'd mask them everywhere.
      # Accepted dormant findings in the gated images are listed in .trivyignore.
      - name: Install Trivy
        if: github.event_name == 'pull_request'
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Scan images for CVEs
        if: github.event_name == 'pull_request'
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          status=0
          for img in tayaway-backend tayaway-geoip; do
            ref="ghcr.io/${OWNER}/${img}:${SHA}"
            echo "::group::${img} — HIGH/CRITICAL (gating)"
            trivy image --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --no-progress "$ref" || status=1
            echo "::endgroup::"
            echo "::group::${img} — MEDIUM (report only)"
            trivy image --severity MEDIUM --ignore-unfixed \
              --exit-code 0 --no-progress "$ref"
            echo "::endgroup::"
          done
          for img in tayaway-edge tayaway-db; do
            ref="ghcr.io/${OWNER}/${img}:${SHA}"
            echo "::group::${img} — all severities (report only, upstream binaries)"
            trivy image --severity HIGH,CRITICAL,MEDIUM --ignore-unfixed \
              --exit-code 0 --no-progress "$ref"
            echo "::endgroup::"
          done
          exit "$status"

      # ── Containerised e2e ────────────────────────────────────────────────────
      # Run the Playwright suite against the real stack, reusing the images the
      # build steps already loaded into the daemon — no second build. PR-only,
      # and only when the container surface changed (see the filter): a generic
      # backend/frontend code PR builds + scans but skips this, the accepted
      # coverage trade. The stack mimics the web.container quadlet (read-only
      # rootfs, MISE_ENV=e2e); see e2e/containerised-up.sh.
      - name: Detect container-stack changes
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'containers/**'
              - 'backend/Gemfile.lock'
              - 'aube-lock.yaml'
              - 'backend/lib/geo_ip.rb'
              - 'playwright.config.ts'
              - 'e2e/**'
              - '.github/workflows/images.yml'

      # node + aube only. The backend runs in a container, so skip the mise
      # postinstall hook (MISE_NO_HOOKS) that would otherwise bundle install the
      # backend gems on the runner — wasted work here.
      - name: Set up node toolchain
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
        env:
          MISE_NO_HOOKS: "1"

      - name: Cache frontend node_modules
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: node-${{ runner.os }}-

      - name: Cache Playwright browsers
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install JS deps + Playwright
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        run: |
          aube ci
          aube exec playwright install chromium --with-deps

      # localhost addressing works because the containers share one netns;
      # FRONTEND_URL is the edge origin so backend-side origin / WebAuthn line up.
      - name: Write e2e dotenv
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        run: |
          cat > backend/.env.e2e <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/tayaway_e2e
          APP_SECRET=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
          FRONTEND_URL=http://localhost:8080
          VAPID_PUBLIC_KEY=BPDZXyMZhyzQ-lmi5MAm-djBp5kecbgrlVGSZ6TsE8yUEOX_cEid5TxdYbBv3YoA2OiwjIHiilvTwA9-vCWeQpE=
          VAPID_PRIVATE_KEY=CofJgcTG6lqV_HszPSpDw_oE3s8fhbQEsBZJ1Ne9t_k=
          VAPID_SUBJECT=mailto:noreply@tayaway.nl
          EOF

      - name: Bring up the container stack
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tayaway-backend:${{ github.sha }}
          EDGE_IMAGE: ghcr.io/${{ github.repository_owner }}/tayaway-edge:${{ github.sha }}
          DB_IMAGE: ghcr.io/${{ github.repository_owner }}/tayaway-db:${{ github.sha }}
          ENV_FILE: ${{ github.workspace }}/backend/.env.e2e
        run: bash e2e/containerised-up.sh

      - name: Run Playwright against the stack
        if: github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          E2E_CONTAINERISED: "1"
        run: aube exec playwright test

      - name: Dump container logs
        if: failure() && github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        run: |
          for c in tayaway-e2e-db tayaway-e2e-web tayaway-e2e-edge; do
            echo "::group::logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: failure() && github.event_name == 'pull_request' && steps.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: containerised-e2e-report
          path: playwright-report/
          retention-days: 7
