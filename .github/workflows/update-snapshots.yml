name: Update visual baselines

# Manually re-generates the Playwright visual-regression baselines in CI and
# commits them back to the triggering branch. Runs on Linux so the baselines
# match what `ci.yml` renders against — local macOS/Windows runs of
# `--update-snapshots` produce environment-specific images that aren't tracked.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          # Need the branch's full history so the bot push fast-forwards instead
          # of clobbering, and a token that can push back (default token's
          # GITHUB_TOKEN is fine because `permissions: contents: write` is set).
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt-get install -y libmaxminddb-dev

      - name: Cache frontend node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # mise's `_.file = ".env.{{env.MISE_ENV | ... }}"` template owns env
      # loading for backend tasks, so every CI-only value belongs in the
      # dotenv files it'll consume (test or e2e) rather than in a workflow-
      # level `env:` block. The files themselves are .gitignored because
      # contents differ per developer machine.
      #
      # APP_SECRET is test-only signing material — required by Config,
      # never used to protect real data.
      #
      # The VAPID keys are test-only material generated for the push smoke
      # test; the frontend gates the subscribe flow on a non-empty public
      # key, so the test fails without them. Safe to commit because they
      # grant nothing — real deploys carry production keys via Capistrano
      # env, never CI.
      - name: Write CI dotenv files
        run: |
          cat > backend/.env.test <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/tayaway_test
          APP_SECRET=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
          EOF
          cat > backend/.env.e2e <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/tayaway_e2e
          APP_SECRET=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
          FRONTEND_URL=http://localhost:5174
          VAPID_PUBLIC_KEY=BPDZXyMZhyzQ-lmi5MAm-djBp5kecbgrlVGSZ6TsE8yUEOX_cEid5TxdYbBv3YoA2OiwjIHiilvTwA9-vCWeQpE=
          VAPID_PRIVATE_KEY=CofJgcTG6lqV_HszPSpDw_oE3s8fhbQEsBZJ1Ne9t_k=
          VAPID_SUBJECT=mailto:noreply@tayaway.nl
          EOF

      - name: Set up test database
        run: mise run //backend:db:setup-test

      # `--update-snapshots=all` (rather than the default `changed` mode)
      # always rewrites the baseline, even when the new render falls within
      # the spec's pixel-ratio tolerance against the existing image. Without
      # it, a visual fix smaller than the tolerance would leave the stale
      # baseline in place — which is exactly the case this workflow exists
      # to handle.
      #
      # Restricted to the design-system spec so the workflow can't silently
      # bake other tests' incidental output into a baseline.
      - name: Regenerate visual baselines
        run: mise run e2e -- design-system --update-snapshots=all

      # Commit via the GraphQL `createCommitOnBranch` mutation rather than
      # `git push`. Commits authored through GitHub's API are automatically
      # signed by GitHub and show up "Verified", which lets branches with
      # required-signatures protection accept the refreshed baseline. A
      # plain `git push` from the runner produces unsigned commits and
      # blocks the merge.
      #
      # The mutation authenticates as a fine-grained PAT
      # (BASELINE_BOT_TOKEN) rather than the default `GITHUB_TOKEN`.
      # GitHub deliberately suppresses workflow triggers from
      # `GITHUB_TOKEN`-authored events to prevent runaway loops, which
      # means a bot-pushed baseline commit doesn't fire the
      # `pull_request: synchronize` event and CI never runs on it. The
      # PAT authenticates as a real user, so the resulting commit fires
      # triggers like any other push and ci.yml runs against the
      # refreshed branch.
      #
      # `expectedHeadOid` makes the mutation atomic: if anything else
      # pushes to the branch between us reading HEAD and creating the
      # commit, the call fails rather than silently overwriting.
      #
      # `github.ref_name` is user-controllable (branch name), so it flows
      # through env into `process.env` inside the script — never inlined
      # into the mutation string or any shell command.
      - name: Commit refreshed baselines (signed via GraphQL)
        uses: actions/github-script@v8
        env:
          TARGET_REF: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.BASELINE_BOT_TOKEN }}
          script: |
            const fs = require('fs')
            const { execFileSync } = require('child_process')

            const sh = (cmd, args) =>
              execFileSync(cmd, args, { encoding: 'utf8' }).trim()
            const lines = (s) => s.split('\n').filter(Boolean)

            // Changed tracked files + untracked files under e2e/tests. The
            // baseline regen step is the only thing that touches that tree,
            // so anything dirty here is by definition a refreshed snapshot.
            const changed = lines(
              sh('git', ['diff', '--name-only', '--', 'e2e/tests'])
            )
            const untracked = lines(
              sh('git', ['ls-files', '--others', '--exclude-standard', '--', 'e2e/tests'])
            )
            const paths = [...new Set([...changed, ...untracked])]

            if (paths.length === 0) {
              core.info('No baseline changes — nothing to commit.')
              return
            }

            const additions = paths.map((path) => ({
              path,
              contents: fs.readFileSync(path).toString('base64'),
            }))

            const expectedHeadOid = sh('git', ['rev-parse', 'HEAD'])

            const result = await github.graphql(
              `mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { url }
                }
              }`,
              {
                input: {
                  branch: {
                    repositoryNameWithOwner: process.env.GITHUB_REPOSITORY,
                    branchName: process.env.TARGET_REF,
                  },
                  message: { headline: 'Refresh visual baselines' },
                  fileChanges: { additions },
                  expectedHeadOid,
                },
              }
            )

            core.info(
              `Created signed commit: ${result.createCommitOnBranch.commit.url}`
            )
