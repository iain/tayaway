name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "doc/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "*.md"
      - "doc/**"
      - ".claude/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      # mise-action's postinstall hook runs `setup:deps`, which `bundle
      # install`s — and the mmdb gem builds a native extension against
      # libmaxminddb. Has to be installed before mise-action runs, not
      # after, or that gem fails to compile and everything downstream
      # falls over with "Could not find mmdb-0.3.2 in locally installed
      # gems" once any task tries to bundle exec.
      - name: Install system dependencies
        run: sudo apt-get install -y libmaxminddb-dev

      # node_modules and the Playwright browser cache live outside mise's
      # install dir, so they need their own caches; gems and tool binaries
      # are inside ~/.local/share/mise/installs and ride along with
      # mise-action's cache: true.
      - name: Cache frontend node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: node-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('aube-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install Playwright browsers
        run: aube exec playwright install chromium --with-deps

      # mise owns env loading via `_.file = ".env.{{env.MISE_ENV | ... }}"`
      # in backend/mise.toml — every CI-only value belongs in the dotenv
      # files mise consumes (test or e2e) rather than in a workflow-level
      # `env:` block. The files themselves are .gitignored because contents
      # differ per developer machine.
      #
      # Writing both here means `mise run ci` can fan out check + e2e in
      # parallel — each picks up its own DB without having to thread two
      # DATABASE_URLs through a single Actions step env.
      #
      # APP_SECRET is test-only signing material — required by Config,
      # never used to protect real data.
      #
      # The VAPID keys are test-only material generated for the push smoke
      # test (`notifications-push.spec.ts`); the frontend gates the
      # subscribe flow on a non-empty public key, so the test fails without
      # them. Safe to commit because they grant nothing — production keys
      # live in sops-encrypted .env.production.yaml decrypted on the box at
      # container start, never in CI.
      - name: Write CI dotenv files
        run: |
          cat > backend/.env.test <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/tayaway_test
          APP_SECRET=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
          EOF
          cat > backend/.env.e2e <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/tayaway_e2e
          APP_SECRET=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
          FRONTEND_URL=http://localhost:5174
          VAPID_PUBLIC_KEY=BPDZXyMZhyzQ-lmi5MAm-djBp5kecbgrlVGSZ6TsE8yUEOX_cEid5TxdYbBv3YoA2OiwjIHiilvTwA9-vCWeQpE=
          VAPID_PRIVATE_KEY=CofJgcTG6lqV_HszPSpDw_oE3s8fhbQEsBZJ1Ne9t_k=
          VAPID_SUBJECT=mailto:noreply@tayaway.nl
          EOF

      - name: Set up test database
        run: mise run //backend:db:setup-test

      # `mise run ci` runs check (lint, typecheck, test, audit) and e2e
      # in parallel, mirroring `mise run ci` on a developer machine.
      # Lint is CI-aware: with $CI set, the root `lint` task runs hk's
      # report-only `check` hook instead of `fix`, so autofix can't silently
      # mask offenses in the ephemeral workspace.
      - name: Run CI
        run: mise run ci

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
