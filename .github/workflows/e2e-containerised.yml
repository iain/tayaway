# Runs the Playwright suite against the actual production images instead of the
# dev webServer, catching regressions the normal e2e job can't: Falcon under a
# read-only rootfs + tmpfs, Caddy's reverse-proxy / WS upgrade, and env loading
# from the built image. Builds backend + edge + db, stands them up sharing one
# network namespace (see e2e/containerised-up.sh), and runs the data-driven
# specs against the edge in MISE_ENV=e2e (so the /api/test/* routes are live).
#
# Triggers on changes to the container-stack surface, or on demand. Not a push
# job — it gates PRs that touch how the stack is built or served.
name: Containerised e2e

on:
  pull_request:
    paths:
      - "containers/**"
      - "**/*.container"
      - "**/*.timer"
      - "**/Caddyfile"
      - "backend/Gemfile.lock"
      - "pnpm-lock.yaml"
      - "backend/lib/geo_ip.rb"
      - "playwright.config.ts"
      - "e2e/**"
      - ".github/workflows/e2e-containerised.yml"
  workflow_dispatch:

concurrency:
  group: container-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      # ── Build the production images into the local docker daemon ─────────────
      # Mirrors images.yml's toolchain handshake: backend + edge FROM the
      # toolchain image, so resolve its tag and wait for CI to publish it.
      - name: Compute toolchain tag
        id: toolchain
        run: echo "tag=$(./.mise/tasks/toolchain/tag)" >> "$GITHUB_OUTPUT"

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Wait for toolchain image
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.toolchain.outputs.tag }}
        run: |
          for i in $(seq 1 90); do
            if skopeo inspect "docker://ghcr.io/${OWNER}/tayaway-toolchain:${TAG}" >/dev/null 2>&1; then
              echo "toolchain ${TAG} present"
              exit 0
            fi
            echo "waiting for toolchain ${TAG} (${i}/90)"
            sleep 10
          done
          echo "toolchain ${TAG} never appeared — check the toolchain workflow"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          target: backend
          load: true
          tags: tayaway-backend:e2e
          build-args: |
            TOOLCHAIN_IMAGE=ghcr.io/${{ github.repository_owner }}/tayaway-toolchain:${{ steps.toolchain.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-backend:buildcache

      - name: Build edge
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          target: edge
          load: true
          tags: tayaway-edge:e2e
          build-args: |
            TOOLCHAIN_IMAGE=ghcr.io/${{ github.repository_owner }}/tayaway-toolchain:${{ steps.toolchain.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-edge:buildcache

      - name: Build db
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile.db
          load: true
          tags: tayaway-db:e2e
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/tayaway-db:buildcache

      # ── Node / pnpm / Playwright on the runner to drive the suite ────────────
      # The backend runs in a container; the runner only needs the JS toolchain
      # to execute Playwright. Mirrors ci.yml (libmaxminddb-dev before mise so
      # the mmdb gem in the postinstall bundle install compiles).
      - name: Install system dependencies
        run: sudo apt-get install -y libmaxminddb-dev

      - name: Cache frontend node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # ── Bring up the stack and run the suite ─────────────────────────────────
      # The stack mounts this file as .env.e2e (MISE_ENV=e2e loads it). localhost
      # addressing works because the containers share one netns; FRONTEND_URL is
      # the edge origin so backend-side origin / WebAuthn checks line up.
      - name: Write e2e dotenv
        run: |
          cat > backend/.env.e2e <<'EOF'
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/tayaway_e2e
          APP_SECRET=dGVzdHNlY3JldHRlc3RzZWNyZXR0ZXN0c2VjcmV0dGU=
          FRONTEND_URL=http://localhost:8080
          VAPID_PUBLIC_KEY=BPDZXyMZhyzQ-lmi5MAm-djBp5kecbgrlVGSZ6TsE8yUEOX_cEid5TxdYbBv3YoA2OiwjIHiilvTwA9-vCWeQpE=
          VAPID_PRIVATE_KEY=CofJgcTG6lqV_HszPSpDw_oE3s8fhbQEsBZJ1Ne9t_k=
          VAPID_SUBJECT=mailto:noreply@tayaway.nl
          EOF

      - name: Bring up the container stack
        env:
          BACKEND_IMAGE: tayaway-backend:e2e
          EDGE_IMAGE: tayaway-edge:e2e
          DB_IMAGE: tayaway-db:e2e
          ENV_FILE: ${{ github.workspace }}/backend/.env.e2e
        run: bash e2e/containerised-up.sh

      - name: Run Playwright against the stack
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
          E2E_CONTAINERISED: "1"
        run: pnpm exec playwright test

      # Dump container logs when something fails — the failure is usually in the
      # stack (a service that didn't boot under read-only, a proxy misroute),
      # not in Playwright itself.
      - name: Dump container logs
        if: failure()
        run: |
          for c in tayaway-e2e-db tayaway-e2e-web tayaway-e2e-edge; do
            echo "::group::logs $c"
            docker logs "$c" 2>&1 | tail -200 || true
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: containerised-e2e-report
          path: playwright-report/
          retention-days: 7
