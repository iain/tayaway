# The deploy gate. images.yml publishes a per-commit :<sha> image for every
# main push unconditionally, but the box's pull-based self-deploy only ever
# follows :main — and this workflow is the *only* thing that moves :main. It
# runs after CI completes on main and advances :main to the just-built :<sha>
# only when CI passed, so a commit whose tests fail (but whose image builds)
# never reaches production.
#
# Fails closed: if this doesn't run or errors, :main stays where it is and the
# box keeps serving its current image. Use the workflow_dispatch override to
# move :main by hand (e.g. after fixing this workflow, or to roll forward).
#
# Why a retag and not a rebuild: images.yml already built and pushed :<sha>;
# `buildx imagetools create` just points :main at that existing manifest
# registry-side — no pull, no rebuild.
name: Promote main images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "40-char commit SHA to promote to :main (manual override)"
        required: true

permissions:
  packages: write

# Never cancel a tag move mid-flight, and serialise overlapping promotions.
concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    # workflow_run only fires for CI runs on main (branches filter above); gate
    # on the run having succeeded. workflow_dispatch is the manual override.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate the SHA
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then sha="$IN_SHA"; else sha="$WR_SHA"; fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "refusing to promote a non-SHA value: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # images.yml runs in parallel with CI, so the :<sha> images may not be
      # pushed yet when CI finishes. Wait for all three before retagging.
      - name: Wait for the :<sha> images
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          for img in tayaway-backend tayaway-edge tayaway-geoip; do
            ref="ghcr.io/${OWNER}/${img}:${SHA}"
            ok=
            for i in $(seq 1 60); do
              if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then ok=1; break; fi
              echo "waiting for ${ref} (${i}/60)"
              sleep 10
            done
            if [ -z "$ok" ]; then
              echo "${ref} never appeared — images.yml build for this SHA failed or is too slow" >&2
              exit 1
            fi
          done

      # Move :main onto the CI-passed :<sha>. db is intentionally excluded — it
      # has no :main tag and its own SHA lifecycle (matches self-deploy.sh).
      - name: Promote :main
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          for img in tayaway-backend tayaway-edge tayaway-geoip; do
            echo "promoting ${img}:main -> ${SHA}"
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${img}:main" \
              "ghcr.io/${OWNER}/${img}:${SHA}"
          done
