# Builds and pushes the shared mise toolchain image to GHCR. The tag is a
# content hash of every tracked mise.toml + mise.lock (see
# `.mise/tasks/toolchain/tag`), so:
#
#   - skopeo dedupes on push: if the tag already exists, the push is
#     metadata-only and no blobs upload. Safe to run every time.
#   - App builds reference the same hash, so rolling back to an old git SHA
#     pulls the exact toolchain that SHA tested with.
#
# Workflow only triggers on changes to inputs that affect the hash, so most
# pushes don't run this at all.

name: Toolchain image

on:
  push:
    branches: [main]
    paths:
      - mise.toml
      - mise.lock
      - "**/mise.lock"
      - .mise/tasks/toolchain/**
      - .github/workflows/toolchain.yml
  pull_request:
    paths:
      - mise.toml
      - mise.lock
      - "**/mise.lock"
      - .mise/tasks/toolchain/**
      - .github/workflows/toolchain.yml
  workflow_dispatch:

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Compute the tag before any `mise install`. `mise install` can rewrite
      # mise.lock lazily on first install for a platform, which would change
      # the hash from what's checked into git. The script is plain bash + git
      # so it doesn't need mise to run.
      - name: Compute toolchain tag
        id: tag
        run: echo "tag=$(./.mise/tasks/toolchain/tag)" >> "$GITHUB_OUTPUT"

      # MISE_LOCKED makes `mise install` fail if the lockfile doesn't
      # already cover the resolved versions for this platform — so an
      # out-of-date mise.lock can't silently regenerate on the runner and
      # publish under a tag that no longer matches what's committed.
      # MISE_LOCKED_VERIFY_PROVENANCE forces mise to re-verify SLSA /
      # GitHub attestations and the lockfile checksums against the
      # downloads, instead of trusting the lockfile's prior verdict.
      - uses: jdx/mise-action@v4
        env:
          MISE_LOCKED: "1"
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        with:
          install: true
          cache: true

      # Fork PRs run with a read-only GITHUB_TOKEN that cannot write packages,
      # so the push steps below are skipped there — the job still validates
      # the lockfile via MISE_LOCKED above. If a fork PR changes mise.lock,
      # a maintainer must publish the new tag (workflow_dispatch on a base-repo
      # branch with the same lockfile) or images.yml times out waiting for it.

      # skopeo isn't on ubuntu-latest runners by default. It does the upload
      # rather than `mise oci push` — see the build/push steps below for why.
      - name: Install skopeo
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | skopeo login ghcr.io -u "$GHCR_USER" --password-stdin

      # Two steps rather than one `mise oci push`, deliberately. Since mise
      # 2026.7.12 that command always uses mise's own registry client, which
      # uploads blobs over 64 MiB in chunks that GHCR rejects with "416 Range
      # Not Satisfiable" — our ruby layer is ~146 MiB, so the push dies on it
      # every time. The `--tool` flag that used to force skopeo was removed in
      # the same release, leaving build-then-copy as the documented escape
      # hatch. Collapse this back into `mise oci push` once mise's client can
      # talk to GHCR.
      - name: Build toolchain image
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          MISE_EXPERIMENTAL: "1"
          TAG: ${{ steps.tag.outputs.tag }}
        run: mise oci build -o ./mise-oci -t "$TAG"

      # `-t` above records $TAG as the layout's org.opencontainers.image.ref.name,
      # which is how skopeo's oci: transport picks the manifest out of index.json.
      # Content-addressed: blobs GHCR already has are skipped, so re-pushing an
      # existing tag moves no bytes. No --all — the layout holds a single
      # linux-x64 manifest, and plain copy keeps the destination a bare manifest
      # rather than wrapping it in an index.
      - name: Push toolchain image
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: skopeo copy "oci:./mise-oci:${TAG}" "docker://ghcr.io/${OWNER}/tayaway-toolchain:${TAG}"
