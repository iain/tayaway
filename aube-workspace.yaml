packages:
  - frontend
  - e2e

# Lifecycle-script allowlist. esbuild needs its native binary fetched at
# install time. puppeteer is explicitly disabled (false = reviewed, don't
# build, don't warn): it's a transitive dev-only dep and this project drives
# browsers via Playwright, so its bundled-Chrome download is unused — and aube
# auto-installs before every task, so a failed download would block everything.
allowBuilds:
  esbuild: true
  puppeteer: false
enableGlobalVirtualStore: false

# Serialize the linker. aube 1.23's materializer races at link-concurrency's
# linux default of 16 — parallel tasks collide creating the same nested symlink
# (EEXIST, e.g. @types/estree under @rollup/pluginutils), failing container and
# CI installs intermittently while macOS (default 4) never trips. Forcing 1
# avoids the race at its source and keeps the isolated linker (and its strict
# phantom-dependency checks) everywhere. Cost is serial linking — a few seconds
# on a full clean install, negligible on incremental ones. Revisit when aube
# fixes the race upstream.
linkConcurrency: 1

# Transitive security floors. Nothing here is a direct dependency, so the only
# lever is an override — `aube update` refreshes direct deps only, and a
# transitive that still satisfies its parent's range is never re-resolved.
# Drop each entry once the parent ships a range that floors it on its own.
#
# fast-uri — reached solely via vite-plugin-pwa → workbox-build → ajv, which
# asks for `^3.0.1` and so happily kept the vulnerable 3.1.5. 3.1.6 fixes four
# HIGH advisories (GHSA-fph4-wmhf-6fwf, GHSA-f65p-4m7j-42xc,
# GHSA-jqff-g426-hqxp, GHSA-5jgf-p345-68v8 — SSRF and host confusion), which
# `mise run audit` gates on at --audit-level=high.
overrides:
  fast-uri: "^3.1.6"

# Trust-policy exception (reviewed false positive). workbox-build@7.4.1 — the
# official googlechrome/workbox package, same maintainers/publisher as 7.4.0 —
# swapped the unmaintained @surma/rollup-plugin-off-main-thread for the
# maintained @trickfilm400 fork (surma's plugin doesn't support Rollup 4). The
# trickfilm maintainer attested versions 2.4.3, 2.5.0 and 4.0.0-pre1 but skipped
# provenance on the prerelease 3.0.0-pre1 that 7.4.1 pins, so aube's
# `no-downgrade` policy flags it. Same trusted publisher throughout — not a
# supply-chain downgrade. Pinned to the exact reviewed version so the policy
# resumes guarding any other version.
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
