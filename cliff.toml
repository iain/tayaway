# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# Rendered once at the top of the file.
header = """
# Changelog

All notable changes to this project are documented in this file. The format is
based on [Keep a Changelog](https://keepachangelog.com) and the entries are
generated from [Conventional Commits](https://www.conventionalcommits.org) by
[git-cliff](https://git-cliff.org).
"""
# A Tera template rendered for each release. See https://keats.github.io/tera.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
# Remove leading/trailing whitespace from the rendered body.
trim = true
# Render the body even when there are no releases to process.
render_always = true
# Write the changelog here by default, so `git cliff` needs no `-o` flag.
output = "CHANGELOG.md"
# Regex-based postprocessors applied to the fully rendered changelog. We use the
# <REPO> placeholder in commit_preprocessors below and resolve it to a real URL
# here, so the repo URL lives in exactly one place.
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/iain/tayaway" },
]

[git]
# Parse commits per the Conventional Commits spec (https://www.conventionalcommits.org).
conventional_commits = true
# Drop commits that aren't conventional. The pre-git-cliff history is all
# non-conventional, so it won't appear; the changelog fills in as typed commits
# land. Flip to false to also sweep stray non-conventional commits into "Other".
filter_unconventional = true
# Don't hard-fail on non-conventional commits (filter_unconventional handles them).
require_conventional = false
# Treat each commit as a single unit (don't split on newlines).
split_commits = false
# Regex preprocessors applied to each commit message before parsing. Turn a
# trailing `(#123)` PR/issue ref into a markdown link; <REPO> is resolved by the
# changelog postprocessor above. GitHub redirects /issues/N to /pull/N for PRs.
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },
]
# Keep breaking changes even if a parser would otherwise skip them.
protect_breaking_commits = false
# Regex parsers that assign each commit to a changelog group. The <!-- N --> HTML
# comments only set ordering and are stripped from the rendered heading.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# Keep commits that no parser matched (the ".*" catch-all matches them anyway).
filter_commits = false
# Don't fail the run on an unmatched commit.
fail_on_unmatched_commit = false
# No external-reference link parsers; PR/issue links are handled in preprocessors.
link_parsers = []
# Consider tags from every branch, not just the current one.
use_branch_tags = false
# Order releases and commits chronologically (tags) / topologically (commits).
topo_order = false
topo_order_commits = true
# Order commits within each group oldest-first.
sort_commits = "oldest"
# Don't descend into submodules.
recurse_submodules = false
