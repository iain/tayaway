services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - ~/.claude:/home/ubuntu/.claude:cached
      - ~/.claude.json:/home/ubuntu/.claude.json:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tayaway:tayaway@db:5432/tayaway_development
      PORT: "9292"
      FRONTEND_URL: http://localhost:5173
      APP_SECRET: devcontainer-secret-not-for-production
      SMTP_HOST: localhost
      SMTP_PORT: "587"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_EMAIL: noreply@tayaway.com
      SMTP_DOMAIN: tayaway.com
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      BUNDLE_PATH: /workspace/backend/vendor/bundle
      MISE_YES: "1"

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../.devcontainer/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      POSTGRES_USER: tayaway
      POSTGRES_PASSWORD: tayaway
      POSTGRES_DB: tayaway_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tayaway"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

volumes:
  postgres-data:
