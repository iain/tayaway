# Redirect iainhecker.com to tayaway.nl
server {
    listen 80;
    listen [::]:80;
    server_name iainhecker.com www.iainhecker.com;
    return 301 https://tayaway.nl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iainhecker.com www.iainhecker.com;

    ssl_certificate /etc/letsencrypt/live/iainhecker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iainhecker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tayaway.nl$request_uri;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tayaway.nl;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tayaway.nl;

    # Let's Encrypt TLS certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/tayaway.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tayaway.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static assets — immutable cache headers (Vite hashed filenames)
    location /assets/ {
        alias /var/www/tayaway/current/frontend/dist/assets/;
        expires max;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API routes — proxy to Falcon
    location /api/ {
        proxy_pass http://127.0.0.1:9292;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — proxy with upgrade headers
    location /ws {
        proxy_pass http://127.0.0.1:9292;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback — serve frontend, fall back to backend
    location / {
        root /var/www/tayaway/current/frontend/dist;
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://127.0.0.1:9292;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
