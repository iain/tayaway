# Fail fast on older mise binaries. Now tracks the lockfile format: mise.lock
# is `lockfile_version = 1`, which landed in 2026.8.11 along with `mise lock
# --upgrade` that migrated it off the legacy unversioned format. A v1 lockfile
# binds each original request (`node = "26"`) to the entry it resolved to, so
# overlapping loose and exact requests can pin distinct versions — and so
# tools-lock.yml's `mise lock --bump` can advance them.
#
# Previous floors, all now implied: 2026.6.11 (`monorepo_root` shedding its
# `experimental_` prefix), 2026.7.12 (`mise lock --bump` itself), and 2026.7.13
# (a false "provenance regression" when bumping a locked `github:` tool to a
# version already on disk — tools-lock.yml's exact path).
min_version = "2026.8.11"

# Marks this file as the root of a mise monorepo. Subproject mise.toml files
# (listed below under [monorepo]) get their own tools, env, and tasks, and
# inherit from this root. Cross-subproject task references use //path:task
# (and //...:task wildcards). Monorepo mode is stable as of 2026.6 — the key
# dropped its `experimental_` prefix and no longer requires `experimental = true`.
monorepo_root = true

[monorepo]
config_roots = ["backend", "frontend"]

[hooks]
# After installing or updating any tool, refresh the project's deps so a
# `mise install` (or a Ruby/Node bump that triggers one) leaves you with a
# working bundle + node_modules. setup:deps fans out to both subprojects.
postinstall = { task = "setup:deps" }

[settings]
experimental = true

# Pin resolved tool versions + checksums into mise.lock so installs are
# reproducible across the team and CI. Equivalent to Gemfile.lock /
# aube-lock.yaml but for the toolchain itself.
lockfile = true

# Supply-chain verification at install time. Both are no-ops for backends
# that don't publish provenance, so leaving them on is free insurance for
# the tools that do.
github_attestations = true
slsa = true

[settings.ruby]
compile = false

# Base image for `mise oci build` (the toolchain image, which the backend
# runtime stage is FROM). mise defaults to debian:bookworm-slim; bookworm left
# regular Debian security support on 2026-07-11 and is now LTS-only, so pin
# trixie explicitly — it also matches the postgres:18 runtime in
# containers/Containerfile.db.
#
# NOTE: this file is hashed into the toolchain tag (.mise/tasks/toolchain/tag).
# It has to be — a base change moves no lockfile, so without it the tag would
# keep claiming to describe an image whose contents had changed underneath it.
[oci]
from = "debian:trixie-slim"

# Tools that every subproject (and root scripts: prettier, Playwright)
# needs. Ruby is here rather than in backend/mise.toml so it inherits
# root → subproject (backend/mise.toml declares no Ruby and relies on
# this); the frontend-only-dev cost of installing Ruby is small.
[tools]
node = "26"
ruby = "4"
pitchfork = "latest"
# Git hook manager. Hooks are installed once per machine with `hk install
# --global` (see setup:hooks for the per-repo fallback). hk is pinned (not
# "latest"): hk.pkl's `amends` URL hard-codes the same version and the binary
# must match that schema, so bump both together (in lockstep — currently
# 1.57.0). hk embeds its own pkl evaluator (pklr) since 1.47, so no separate
# pkl CLI tool is needed to parse hk.pkl.
hk = "1.57.0"
aube = "latest"
taplo = "latest"
shellcheck = "latest"
shfmt = "latest"
actionlint = "latest"
# Changelog generator. Reads Conventional Commits from git history and renders
# CHANGELOG.md per cliff.toml. Run via `mise run changelog`.
git-cliff = "latest"

# ── Workflows ────────────────────────────────────────────────────────────────
#
#   dev     Start frontend + backend servers
#   check   Pre-commit: lint, typecheck, test, audit (no e2e)
#   ci      Full verification: check + e2e
#

[tasks.dev]
description = "Start frontend + backend dev servers (managed by pitchfork)"
alias = "d"
# Hand the long-running servers to pitchfork rather than spawning them as
# foreground children. `-l` starts every daemon in pitchfork.toml (backend +
# frontend), ordered by their `depends`, and waits for readiness before
# returning. Follow logs with `pitchfork logs -f` or watch via `pitchfork tui`.
run = "pitchfork start -l"

[tasks.check]
description = "Full local validation: lint, typecheck, test, audit (no e2e)"
alias = "c"
# `lint` runs the hk pipeline (rubocop, eslint, prettier, taplo, shellcheck,
# shfmt, actionlint, cache-version, plus whitespace/merge/secret guards);
# typecheck/test/audit still fan out per-subproject. The pre-commit hook is
# managed by hk (hk.pkl), not a mise task — see setup:hooks.
depends = ["lint", "//...:typecheck", "//...:test", "//...:audit"]

[tasks.ci]
description = "Full CI: check + e2e"
depends = ["check", "e2e"]

# ── Aggregate task wildcards ─────────────────────────────────────────────────
#
# typecheck/test/audit collapse the per-subproject tasks into one root task;
# the subproject definitions are the source of truth and root just fans out.
# `lint` is the exception — linting is a repo-global concern owned by hk
# (hk.pkl), so it delegates there rather than fanning out to subproject tasks.

[tasks.lint]
description = "Lint via hk: rubocop, eslint, prettier, taplo, shellcheck, shfmt, actionlint (autofix locally; report-only when $CI is set)"
# hk's `fix` hook autofixes the whole tree; its `check` hook is report-only.
# CI sets $CI and must not mutate files, so it gets the check hook. hk is a
# mise tool, so it's on PATH here; its steps re-enter mise for ruby/node.
shell = "bash -c"
run = """
if [ -n "${CI:-}" ]; then
  hk check --all
else
  hk fix --all
fi
"""

[tasks.typecheck]
description = "Run all type checkers"
depends = ["//...:typecheck"]

[tasks.test]
description = "Run unit and integration tests"
alias = "t"
depends = ["//...:test"]

[tasks.audit]
description = "Dependency vulnerability scanning"
depends = ["//...:audit"]

[tasks.build]
description = "Build production frontend assets"
depends = ["//frontend:build"]

[tasks.changelog]
description = "Regenerate CHANGELOG.md from Conventional Commits (git-cliff, config in cliff.toml)"
# git-cliff is a root [tools] entry, so `git cliff` is on PATH here; it resolves
# the `git-cliff` binary as a git subcommand. Output path is set in cliff.toml.
run = "git cliff"

# ── E2E (standalone — not part of test:*) ────────────────────────────────────

[tasks.e2e]
description = "Playwright end-to-end tests — extra args pass through to playwright"
# e2e:reset frees the e2e ports first — Playwright's reuseExistingServer=false
# means a server orphaned by a prior interrupted run would otherwise block
# startup for the full 120s webServer timeout (notably under `mise run ci`,
# where check + e2e run concurrently and an earlier crash can leave stragglers).
depends = ["//backend:db:setup-e2e", "//:e2e:reset"]
# Playwright still calls `module.register()` to install its TS ESM loader;
# on Node 22+ that emits DEP0205. Silence only that code so real deprecation
# warnings stay visible. Drop once Playwright migrates to registerHooks().
env = { NODE_OPTIONS = "--disable-warning=DEP0205" }
run = 'aube exec playwright test "$@"'

# Visual-regression baselines (the `*-snapshots/` directories next to specs)
# are environment-dependent — font rendering and antialiasing differ between
# macOS and the Ubuntu runners that drive ci.yml. To keep a single committed
# baseline that matches CI, this task fires the `update-snapshots` workflow on
# the current branch instead of running playwright locally; the workflow
# regenerates on Linux and pushes the refreshed images back here. A `git pull`
# after completion brings them down. Requires gh CLI auth + a pushed branch.
[tasks."e2e:snapshots:update"]
description = "Trigger the GitHub workflow that regenerates Playwright visual baselines on Linux and commits them back"
shell = "bash -c"
run = """
set -euo pipefail
branch=$(git rev-parse --abbrev-ref HEAD)
if [ "$branch" = "HEAD" ]; then
  echo "Detached HEAD — check out a branch before refreshing baselines." >&2
  exit 1
fi
echo "→ dispatching update-snapshots.yml on branch '$branch'"
gh workflow run update-snapshots.yml --ref "$branch"
echo "→ waiting for the run to appear (gh polls every ~3s)…"
sleep 5
run_id=$(gh run list --workflow=update-snapshots.yml --branch "$branch" --limit 1 --json databaseId --jq '.[0].databaseId')
echo "→ watching run $run_id"
gh run watch "$run_id" --exit-status
echo "→ pulling the new baseline commit"
git pull --ff-only origin "$branch"
"""

# ── Backend convenience aliases ──────────────────────────────────────────────
#
# Root-level passthroughs so `mise run db:migrate` from the project root keeps
# working the way it always has. The real definitions live in backend/mise.toml.

[tasks."db:create"]
description = "Create the development database"
depends = ["//backend:db:create"]

[tasks."db:drop"]
description = "Drop the development database"
depends = ["//backend:db:drop"]

[tasks."db:migrate"]
description = "Run database migrations"
depends = ["//backend:db:migrate"]

[tasks."db:rollback"]
description = "Rollback the last migration"
depends = ["//backend:db:rollback"]

[tasks."db:reset"]
description = "Reset the development database"
depends = ["//backend:db:reset"]

[tasks."db:seed"]
description = "Seed the development database"
depends = ["//backend:db:seed"]

[tasks."db:seed-dev"]
description = "Populate the development database with rich sample data"
depends = ["//backend:db:seed-dev"]

[tasks.console]
description = "Open a Ruby console with the app loaded"
depends = ["//backend:console"]

[tasks."dev:reset"]
description = "Free the dev ports — kill anything left holding the backend (:9292) or frontend (:5173) dev server"
depends = ["//backend:dev:reset", "//frontend:dev:reset"]

# ── Setup ────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "Set up the project after cloning"
depends = ["setup:deps", "setup:db", "setup:hooks", "//backend:data:geoip"]
run = "echo \"Setup complete! Run 'mise run dev' to start.\""

[tasks."setup:deps"]
description = "Install all dependencies"
depends = ["//...:setup:deps", "setup:deps-root"]

[tasks."setup:deps-root"]
description = "Install root dependencies (Playwright, prettier)"
# `playwright install` is idempotent — it skips browsers already present in
# ~/Library/Caches/ms-playwright, so re-running setup is cheap. Skip
# --with-deps; on Linux it shells out to apt and wants sudo, which is fine
# in CI / the devcontainer but a friction point for a local dev setup. If
# you hit a missing system lib, run it manually with --with-deps.
run = ["aube install", "aube exec playwright install chromium"]

[tasks."setup:env"]
description = "Generate per-env backend dotenv files from the Config schema (if missing)"
depends = ["//backend:setup:env"]

[tasks."setup:db"]
description = "Create and migrate the development, test, and e2e databases"
# //backend:setup:db depends on //backend:setup:env, so the dotenv files (and
# their DATABASE_URLs) are in place before any DB work runs.
depends = ["//backend:setup:db"]

[tasks."tools:upgrade"]
description = "Bump every config_root's tool versions to the latest available"
# `mise upgrade --bump` only walks the current config_root, so running it at
# the project root never touches backend/mise.lock. Loop so a single command
# bumps every subproject's pins. setup:deps fires via the postinstall hook
# after the install, reinstalling gems/node_modules against the new Rubies/
# Nodes.
#
# This rewrites the pins in mise.toml, which most of ours aren't: `latest` for
# the lint/ops tools and bare majors for node and ruby stay exactly as written.
# To move what those resolve to, run `mise lock --bump` — it advances the
# lockfile only, leaves exact pins (hk) alone, and never edits config. No task
# wraps it: it's a mise command already, and tools-lock.yml (which does it
# weekly and opens a PR) runs under MISE_SAFE=1, where tasks are refused.
shell = "bash -c"
run = """
for dir in . backend frontend; do
  echo "→ upgrading $dir"
  (cd "$dir" && mise upgrade --bump)
done
"""

[tasks."setup:hooks"]
description = "Install git hooks for this repo (fallback for devs without `hk install --global`)"
# Hooks are managed by hk (hk.pkl). The recommended one-time machine setup is
# `hk install --global`, which writes config-based hooks to ~/.gitconfig so
# every repo picks them up. This per-repo `hk install` is a fallback: when
# global hooks already exist it's a no-op (and prunes stale local hooks);
# otherwise it installs hooks for this clone. The unset clears leftover
# core.hooksPath from clones that pre-date the husky removal.
run = """
git config --unset core.hooksPath 2>/dev/null || true
hk install
"""
