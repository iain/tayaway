[env]
# Required for any forked-worker setup on macOS (falcon-host, falcon serve,
# rspec parallelisation): without it, libpq triggers Foundation's fork-safety
# guard and the child process aborts on its first DB connect. Linux ignores
# the variable, so it's safe to set unconditionally for everything mise runs.
OBJC_DISABLE_INITIALIZE_FORK_SAFETY = "YES"

# mise is now the single source of env vars across dev, test, e2e, and
# production — dotenv is gone from Ruby. `_.file` templates the file
# path on MISE_ENV, with `development` as the implicit default so a
# fresh `mise run` from a shell without MISE_ENV set still works.
# RACK_ENV is mirrored for Rack itself and any gem that still keys off
# it; the Config schema reads MISE_ENV directly.
#
# Production loads two files: the plain dotenv (non-secret config, in
# git, readable) and a sops-encrypted yaml (DATABASE_URL, APP_SECRET,
# VAPID_PRIVATE_KEY, etc.). For dev/test/e2e the `.yaml` half doesn't
# exist and mise silently skips it. Decryption happens via the age key
# at $SOPS_AGE_KEY_FILE (laptop) or /etc/tayaway/age.key on the VPS
# (set via MISE_SOPS_AGE_KEY_FILE in the production quadlets).
_.file = [
  ".env.{{env.MISE_ENV | default(value='development')}}",
  ".env.{{env.MISE_ENV | default(value='development')}}.yaml",
]
RACK_ENV = "{{env.MISE_ENV | default(value='development')}}"

# ── Dev ──────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Start backend dev server"
depends = ["db:seed"]
run = "bundle exec falcon-host falcon.rb"

[tasks."dev:e2e"]
description = "Start backend in e2e mode on port 9293 — spawned by playwright.config.ts"
# Re-enter mise with MISE_ENV set in the shell — that's what triggers
# the top-level [env] template to load .env.e2e. Setting MISE_ENV via
# task `env =` would be too late (top-level [env] is resolved first),
# and mise's --env flag triggers profile-config loading rather than
# templating, so it doesn't help here either. FALCON_URL is task-only
# config (port binding), not part of the .env file.
shell = "bash -c"
env = { FALCON_URL = "http://localhost:9293" }
run = 'MISE_ENV=e2e mise exec -- bundle exec falcon-host falcon.rb'

# dev:reset lives in backend/.mise/tasks/dev/reset.

[tasks.serve]
description = "Start falcon-host in the current mise env — used by the production systemd unit"
# `exec` so the shell replaces itself with falcon-host: the systemd unit
# is Type=notify, and we want falcon-host to be as close to the main
# process as possible. (One intermediate `mise run` parent remains, which
# is why the unit sets NotifyAccess=all rather than the default `main`.)
run = "exec bundle exec falcon-host falcon.rb"

# ── Lint / Test / Audit ──────────────────────────────────────────────────────

# Linting (RuboCop) is owned by hk at the repo root — see hk.pkl and the root
# `lint` task. Run just this project's linter with `hk fix backend/` (autofix)
# or `hk check backend/` (report-only), or a single step via `--step rubocop`.

[tasks.test]
description = "RSpec — extra args pass through to rspec"
# Re-enter mise with MISE_ENV=test in the shell so the top-level [env]
# block reloads .env.test for the inner process. See dev:e2e for the
# longer explanation of why neither task `env =` nor `--env` works.
shell = "bash -c"
run = 'MISE_ENV=test mise exec -- bundle exec rspec -f progress "$@"'

[tasks.audit]
description = "bundler-audit"
run = "bundle exec bundler-audit check --update"

# ── Database ─────────────────────────────────────────────────────────────────

[tasks."db:create"]
description = "Create the development database"
run = "bundle exec rake db:create"

[tasks."db:drop"]
description = "Drop the development database"
confirm = "Drop the development database. Continue?"
run = "bundle exec rake db:drop"

[tasks."db:migrate"]
description = "Run database migrations"
run = "bundle exec rake db:migrate"

[tasks."db:rollback"]
description = "Rollback the last migration"
confirm = "Rollback the last migration. This can drop columns or tables. Continue?"
run = "bundle exec rake db:rollback"

[tasks."db:reset"]
description = "Reset the development database"
confirm = "Reset the development database (drops and recreates). Continue?"
run = "bundle exec rake db:reset"

[tasks."db:seed"]
description = "Seed the development database"
run = "bundle exec rake db:seed"

[tasks."db:seed-dev"]
description = "Populate the development database with rich sample data"
run = "bundle exec ruby db/seed_dev.rb"

[tasks."db:setup-e2e"]
description = "Create and migrate the e2e database"
shell = "bash -c"
run = 'MISE_ENV=e2e mise exec -- bundle exec rake db:create db:migrate'

[tasks."db:setup-test"]
description = "Create and migrate the test database"
shell = "bash -c"
run = 'MISE_ENV=test mise exec -- bundle exec rake db:create db:migrate'

# ── Setup ────────────────────────────────────────────────────────────────────

[tasks."setup:deps"]
description = "Install backend dependencies"
run = "bundle install"

[tasks."config:example"]
description = "Regenerate backend/.env.example from the Config schema"
run = "bundle exec rake config:example"

# setup:db and data:geoip live in backend/.mise/tasks/.

# ── Misc ─────────────────────────────────────────────────────────────────────

[tasks.console]
description = "Open a Ruby console with the app loaded"
# Pry needs an exclusive terminal lock. `interactive` grabs stdin/stdout/stderr
# while letting other unrelated tasks still run in parallel — strictly nicer
# than `raw` for a long-lived REPL.
interactive = true
run = "bundle exec pry -r ./config/environment"
